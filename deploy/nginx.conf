# Serves the dashboard and forwards /n/<node>/... to that node's own container.
server {
    listen 80;
    root /usr/share/nginx/html;
    location /n/hub/     { proxy_pass http://hub:7400/; }
    location /n/alpha/   { proxy_pass http://alpha:7401/; }
    location /n/bravo/   { proxy_pass http://bravo:7402/; }
    location /n/charlie/ { proxy_pass http://charlie:7403/; }
    location / { try_files $uri /index.html; }
}
